<!-- Settings from build_page.py: the user's name for their Bishop, accent, warm window, groups, and
     company lists. Never contacts: those come from the export the user uploads in this page. -->
<script id="outreach-config" type="application/json">__CONFIG__</script>
<style>
/* Tokens. Five sizes, two weights (the wordmark's 800 is the brand mark). Orange is spent on
   the mark, In Motion, and the action under the pointer. */
:root{
  --navy:#1a2944;--navy2:#213357;--navy-rule:#31466e;--hd-ink:#eef1f6;--hd-dim:#aab8d0;
  --orange:#ff6a1f;--orange-l:#ffa36b;
  --bg:#f1f3f8;--surface:#ffffff;--raise:rgba(16,24,40,.045);--ink:#111827;--ink2:#465163;--mut:#5f6978;
  --line:#dfe3e9;--line2:#eceff3;--accent:#c2410c;--accent-ink:#ffffff;--accent-weak:#fff1e8;
  --help:#7a3fb0;--help-bg:#f1e8fa;--tint:#e8edf6;--tint-ink:#1a2944;
  --g-warm:#2f9e64;--g-recruiters:#7c5cd6;--g-hr:#1f8f8c;--g-exec:#3b6fd8;--g-founders:#c9831b;--g-others:#7a8599;
  --r:4px;--ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --t-xl:34px;--t-l:20px;--t-m:14px;--t-s:13px;--t-xs:12px;--w-r:400;--w-b:650;
  --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--sh2:0 18px 50px rgba(16,24,40,.22);
}
:root[data-theme=dark]{
  --bg:#0e1422;--surface:#151d2e;--raise:rgba(255,255,255,.05);--ink:#e8ecf3;--ink2:#b9c3d4;--mut:#8f9bb1;
  --line:#28344d;--line2:#1c263a;--accent:#ff8a4c;--accent-ink:#1b0c04;--accent-weak:#2b1d15;
  --help:#c9a2f2;--help-bg:#2a1f3d;--tint:#1d2b47;--tint-ink:#dfe7f5;--sh:0 1px 2px rgba(0,0,0,.35);--sh2:0 24px 60px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--w-r) var(--t-m)/1.5 var(--ui);-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
b,strong{font-weight:var(--w-b)}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
a:hover{color:var(--accent);text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--mono);font-size:var(--t-xs)}

/* Top: Bishop's frame, then the group tabs. Sticky together; on a phone the header tucks away on scroll. */
.top{position:sticky;top:0;z-index:20;transition:transform .2s ease}
.top.tuck{transform:translateY(calc(-1 * var(--hd-h,60px)))}
.hd{background:var(--navy);color:var(--hd-ink);border-top:4px solid var(--orange)}
.hd-in{display:flex;align-items:center;gap:16px;padding:10px 24px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;color:var(--hd-ink);text-decoration:none;flex:none}
.brand svg{width:30px;height:30px;display:block}
.wm{font:800 19px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--orange)}
.wm-sub{font-size:var(--t-s);color:var(--hd-dim);align-self:flex-end;margin-bottom:1px}
.why .tag.grp{flex:none}
.hd-tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.search{position:relative}
.search input{width:340px;background:var(--navy2);border:1px solid var(--navy-rule);border-radius:var(--r);color:var(--hd-ink);padding:7px 34px 7px 11px;height:36px}
.search input::placeholder{color:var(--hd-dim)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:var(--t-xs) var(--mono);color:var(--hd-dim);border:1px solid var(--navy-rule);border-radius:3px;padding:0 5px;pointer-events:none}
.search input:not(:placeholder-shown)~kbd{display:none}
.icon{width:36px;height:36px;display:grid;place-items:center;background:transparent;border:1px solid var(--navy-rule);border-radius:var(--r);color:var(--hd-ink)}
.icon svg{width:17px;height:17px}
.hbtn{height:36px;display:inline-flex;align-items:center;gap:7px;padding:0 12px;background:transparent;border:1px solid var(--navy-rule);border-radius:var(--r);color:var(--hd-ink);white-space:nowrap}
.hbtn svg{width:16px;height:16px}.hbtn:hover,.icon:hover{border-color:var(--hd-ink)}
.drop{display:grid;place-items:center;gap:10px;text-align:center;border:2px dashed var(--line);border-radius:var(--r);padding:26px 16px;margin:14px 0 8px;background:var(--tint);color:var(--ink2)}
.drop.over{border-color:var(--accent);background:var(--accent-weak)}
.drop b{color:var(--ink)}
.drop .err{color:#e5484d;font-weight:var(--w-b)}
.upl .facts{margin:8px 0 4px}
.upl .fact b{font-size:1.15em}
.upl .gl{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.upl .gl li{background:var(--tint);border-radius:999px;padding:3px 10px;font-size:var(--t-s);color:var(--ink2)}
.upl .gl b{color:var(--ink)}
/* The theme button shows the theme it switches to. */
:root[data-theme=dark] #themeBtn .i-moon,:root:not([data-theme=dark]) #themeBtn .i-sun{display:none}

.sug{position:absolute;right:0;top:calc(100% + 6px);width:420px;max-width:calc(100vw - 32px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh2);padding:4px;z-index:40}
.sug .sh{font-size:var(--t-xs);color:var(--mut);font-weight:var(--w-b);padding:8px 9px 2px}
.sug button{display:grid;grid-template-columns:1fr auto;gap:0 10px;width:100%;text-align:left;background:transparent;border:0;border-radius:3px;padding:7px 9px}
.sug button.on,.sug button:hover{background:var(--accent-weak)}
.sug .k{color:var(--mut);font-size:var(--t-xs);grid-row:span 2;align-self:center}
.sug .s{color:var(--mut);font-size:var(--t-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug mark{background:none;color:inherit;font-weight:var(--w-b);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.sug .none{padding:10px;color:var(--mut)}

.tabs{display:flex;gap:2px;align-items:flex-end;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{display:flex;align-items:center;gap:7px;padding:11px 12px 12px;color:var(--ink2);text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current=page]{color:var(--ink);font-weight:var(--w-b);border-bottom-color:var(--accent)}
.tabs .c{font:var(--t-xs) var(--mono);color:var(--mut)}
.tabs .sep{width:1px;background:var(--line);margin:10px 6px;flex:none;align-self:stretch}
.tabs a.motion{color:var(--accent);font-weight:var(--w-b);background:var(--accent-weak);border-radius:var(--r) var(--r) 0 0;margin:6px 4px -1px 0;padding:6px 14px 9px}
.tabs a.motion[aria-current=page]{border-bottom-color:var(--accent)}
.tabs a.motion .c{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;font-weight:var(--w-b)}
.tabs a.motion .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.tabs .c.pulse{animation:pulse .6s ease}
@keyframes pulse{40%{transform:scale(1.35)}}
.gsel{display:none}

main{flex:1;padding:16px 24px 90px;outline:none}

/* Page head: the group's name is the headline, its count beside it. */
.ph{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 12px}
.ph .tools{margin:0 0 0 auto;align-self:center}
.lede{margin:0;color:var(--ink2);font-size:var(--t-m);display:flex;align-items:center;align-self:center}
.ph[class*="g-"] .lede::before,.ph.motion .lede::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--gc,var(--accent));box-shadow:0 0 0 4px color-mix(in srgb,var(--gc,var(--accent)) 25%,transparent);margin-right:12px;flex:none}
.ph h1{margin:0;font-size:var(--t-xl);line-height:1.1;letter-spacing:-.02em;font-weight:var(--w-b)}
.cnt{color:var(--mut)}.cnt b{font-family:var(--mono);color:var(--ink);font-weight:var(--w-b)}
.inmo{font-size:var(--t-s)}
.about{position:relative;align-self:center}
.about summary{list-style:none;cursor:pointer;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--mut);font-size:var(--t-s)}
.about summary::-webkit-details-marker{display:none}
.about[open] summary{color:var(--ink);border-color:var(--ink2)}
.pop{position:absolute;left:0;top:32px;z-index:12;width:min(360px,80vw);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh2);padding:12px 14px;color:var(--ink2)}
.pop p{margin:0}.pop ol{margin:6px 0 0;padding-left:18px}.pop li{margin:2px 0}

/* One toolbar row: filters left, view and sort right. */
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.tools .sp{flex:1}
.chipf{background:var(--surface);border:1px solid var(--line);color:var(--ink2);border-radius:999px;padding:4px 12px;height:32px}
.chipf[aria-pressed=true]{background:var(--accent-weak);border-color:var(--accent);color:var(--accent);font-weight:var(--w-b)}
.seg{display:inline-flex;align-items:center;gap:2px;background:var(--line2);border:1px solid var(--line);border-radius:var(--r);padding:2px}
.seg span{font-size:var(--t-s);color:var(--mut);padding:0 8px 0 6px}
.seg button{border:0;background:transparent;border-radius:3px;padding:4px 12px;height:28px;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:var(--w-b);box-shadow:var(--sh)}
.mtools{display:none}

/* The ranked list. */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.row,.lhead{display:grid;grid-template-columns:22px 34px minmax(200px,1.25fr) minmax(130px,.8fr) minmax(0,1.6fr) auto;align-items:center;gap:12px;padding:5px 14px 5px 12px;border-bottom:1px solid var(--line2);min-height:52px}
.row:last-child{border-bottom:0}
.row{transition:background .12s ease}
.row:hover{background:var(--raise)}
.row.focus{background:var(--raise);box-shadow:inset 3px 0 0 var(--accent)}
.row.selected{background:var(--accent-weak)}
.row.leaving{opacity:0;overflow:hidden;transition:height .15s ease,opacity .12s ease,padding .15s ease;padding-top:0;padding-bottom:0;min-height:0}
.lhead{min-height:0;padding-top:8px;padding-bottom:8px;background:var(--navy);border-bottom:1px solid var(--navy-rule);font-size:var(--t-xs);font-weight:var(--w-b);color:var(--hd-dim);position:sticky;top:var(--top-h,96px);z-index:5}
.list>.lhead:first-child{border-radius:var(--r) var(--r) 0 0}
.ck{width:16px;height:16px;accent-color:var(--accent);margin:0 auto;display:block}
.row .ck{opacity:0;transition:opacity .1s}
.row:hover .ck,.row:focus-within .ck,.selecting .row .ck,.row .ck:checked{opacity:1}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:var(--t-xs);font-weight:var(--w-b);letter-spacing:.02em;background:color-mix(in srgb,var(--gc) 20%,var(--surface));color:color-mix(in srgb,var(--gc) 70%,var(--ink));flex:none}
.av.sm{width:26px;height:26px;font-size:11px}
.av.lg{width:48px;height:48px;font-size:var(--t-m)}
.g-others{--gc:var(--g-others)}
/* Each group's color class (.g-<key>) is written by the script, since the groups come from the config. */
.who{background:transparent;border:0;text-align:left;padding:0;min-width:0;display:block;width:100%;line-height:1.35}
.who .nm{font-weight:var(--w-b);display:inline}
.who .sub{color:var(--mut);font-size:var(--t-s);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .co-in{display:none}
.nmline{display:flex;align-items:center;gap:6px;min-width:0}
.starb{background:transparent;border:0;color:var(--mut);font-size:var(--t-m);line-height:1;width:24px;height:24px;border-radius:var(--r);flex:none;opacity:0;transition:opacity .1s}
.row:hover .starb,.row:focus-within .starb,.starb[aria-pressed=true]{opacity:1}
.starb[aria-pressed=true]{color:var(--accent)}
.coc{color:var(--ink2);font-size:var(--t-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.why{display:flex;align-items:center;gap:8px;min-width:0;color:var(--mut);font-size:var(--t-s)}
.why .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-xs);font-weight:var(--w-b);padding:1px 8px;border-radius:999px;border:1px solid transparent;color:var(--tint-ink);white-space:nowrap;background:var(--tint)}
.tag.grp{background:color-mix(in srgb,var(--gc) 18%,var(--surface));color:color-mix(in srgb,var(--gc) 70%,var(--ink))}
.tag.help{border-color:transparent;background:var(--help-bg);color:var(--help)}
.tag .tgt{width:10px;height:10px;color:var(--accent)}
.act{justify-self:end;display:flex;gap:6px;align-items:center}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:5px 12px;color:var(--ink);height:32px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink2)}
.btn .ic{display:none;width:16px;height:16px}
.btn.go{font-weight:var(--w-b);background:var(--accent-weak);border-color:transparent;color:var(--accent)}
.row:hover .btn.go,.row:focus-within .btn.go,.btn.go:hover,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{font-weight:var(--w-b)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--mut)}
.btn.quiet:hover{color:var(--ink);border-color:var(--line)}
.stp{font-size:var(--t-xs);color:var(--mut)}
.more{display:block;margin:12px auto 0}
.empty{padding:40px 20px;text-align:center;color:var(--ink2)}
.linkish{color:var(--ink);background:none;border:0;padding:0;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.linkish:hover{color:var(--accent);text-decoration-color:currentColor}

/* Guide cards. */
.tip{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:12px 14px;margin:0 0 14px;max-width:880px}
.tip ul{margin:4px 0 0;padding-left:18px;color:var(--ink2)}.tip li{margin:2px 0}
.tip-x{display:flex;gap:12px;align-items:center;flex:none}

/* In Motion: four columns that fill the window. */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,.8fr);gap:12px;min-height:calc(100dvh - var(--top-h,96px) - 190px)}
.col{background:color-mix(in srgb,var(--surface) 55%,var(--bg));border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column}
.col{border-top:3px solid var(--st,var(--line))}
.col[data-stage="Up Next"]{--st:color-mix(in srgb,var(--accent) 50%,var(--surface))}.col[data-stage="Contacted"]{--st:var(--accent)}.col[data-stage="Active"]{--st:var(--g-active,#2f9e64)}.col[data-stage="Concluded"]{--st:var(--help)}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col h2{font-size:var(--t-m);margin:0 2px 2px;display:flex;justify-content:space-between;font-weight:var(--w-b)}
.col h2 span{font:var(--t-xs) var(--mono);color:var(--mut);align-self:center}
.colsub{margin:0 2px 10px;font-size:var(--t-xs);color:var(--mut)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer;position:relative}
.card:hover{border-color:var(--ink2)}
.card.drag{opacity:.4}
.card .top2{display:flex;gap:10px;align-items:center}
.card .who{padding:0}
.card .last{margin:8px 0 0;font-size:var(--t-s);color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .last b{color:var(--mut)}
/* A fixed footer row: the tag sits there, and the actions fade in over it, so a card never changes height. */
.card .cfoot{position:relative;height:30px;margin-top:8px}
.card .meta{position:absolute;inset:0;display:flex;gap:6px;align-items:center;transition:opacity .12s}
.card .mv{position:absolute;inset:0;display:flex;gap:4px;align-items:center;opacity:0;pointer-events:none;transition:opacity .12s}
.card .mv .btn{height:28px;padding:2px 9px;font-size:var(--t-s)}
.card .mv .sp{flex:1}
.card:hover .mv,.card:focus-within .mv{opacity:1;pointer-events:auto}
.card:hover .meta,.card:focus-within .meta{opacity:0}
@media (hover:none){.card .mv{display:none}.card:hover .meta,.card:focus-within .meta{opacity:1}}
.col.done .card{box-shadow:none;background:transparent}
.colhint{color:var(--mut);font-size:var(--t-s);text-align:center;padding:18px 8px;border:1px dashed var(--line);border-radius:var(--r);margin-top:auto;margin-bottom:auto}
.mseg{display:none}

/* Company view: each company a header, its people beneath. */
.coblk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:0 0 12px;box-shadow:var(--sh)}
.cohead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);background:var(--tint);border-radius:var(--r) var(--r) 0 0}
.cohead .who{color:var(--tint-ink)}
.mono{width:32px;height:32px;border-radius:var(--r);display:grid;place-items:center;font-size:var(--t-xs);font-weight:var(--w-b);background:var(--navy);color:var(--hd-ink);border:1px solid var(--navy-rule);flex:none}
.mono.lg{width:48px;height:48px;font-size:var(--t-m)}
.cohead .who{width:auto;font-weight:var(--w-b);padding:0}
.cohead .cnt2{color:var(--mut);font-size:var(--t-s);margin-left:auto}
.cohead .starb{opacity:1}
.coblk .list{border:0;box-shadow:none;border-radius:0}
.coblk .row{grid-template-columns:22px 34px minmax(200px,1.25fr) minmax(0,1.6fr) auto}
.coblk .row .coc{display:none}
.coblk .morep{display:block;padding:8px 14px 10px;font-size:var(--t-s)}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;width:30px;height:30px;border-radius:var(--r);display:grid;place-items:center;color:var(--mut);border:1px solid transparent}
.menu summary::-webkit-details-marker{display:none}
.menu summary:hover,.menu[open] summary{border-color:var(--line);color:var(--ink)}
.mpop{position:absolute;right:0;top:34px;z-index:12;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh2);padding:4px;min-width:200px}
.mpop button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:3px;padding:8px 10px;color:var(--ink)}
.mpop button:hover{background:var(--raise)}

<script>
"use strict";
/* ---------- Settings: filled in by build_page.py from the user's Bishop folder ---------- */
const CONFIG=(()=>{try{const c=JSON.parse(document.getElementById('outreach-config').textContent);return c&&typeof c==='object'&&!Array.isArray(c)?c:{}}catch(e){return{}}})();
const BOT_NAME=String(CONFIG.name||'').trim()||'Bishop';

/* ---------- The network: the user's own LinkedIn export, read in this browser ---------- */
let EXPORT_LABEL='',EXPORTED='';
const BOARD_KEY='bishop_outreach_board_v1',NET_KEY='bishop_outreach_network_v1',THEME_KEY='bishop_outreach_theme';
const slug=s=>s.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const COS=[],CO={},P=[],PI={};
const LV=t=>/chief|\bceo\b|\bcoo\b|\bcfo\b|\bcto\b|chro|president|founder|managing director|owner/i.test(t)?0:/\bvp\b|svp|head of|general manager|partner/i.test(t)?1:/director|lead|principal|manager/i.test(t)?2:3;
// A company counts as a search firm when its name says so.
const SEARCH_FIRM=/\b(search|recruit\w*|staffing|headhunt\w*|talent partners)\b/i;
/* Company names compare without case, accents, punctuation, or a trailing Inc, LLC, Ltd and the like. */
const CO_SUFFIX=new Set(['inc','incorporated','llc','llp','lp','pllc','ltd','limited','corp','corporation','co','company','plc','gmbh','ag','sa','nv','bv','pty','pc']);
function normCo(s){const w=String(s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean);
  while(w.length>1&&CO_SUFFIX.has(w[w.length-1]))w.pop();return w.join(' ')}
const normName=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/’/g,"'").replace(/[^a-z0-9' -]+/g,' ').replace(/\s+/g,' ').trim();
let PAST=new Set(),SEARCH=new Set();
function companyOf(name){const nm=(name||'').trim()||'No company listed',n=normCo(name);
  return{name:nm,slug:slug(n||'none')||'none',norm:n,search:SEARCH_FIRM.test(name||''),inSearch:!!n&&SEARCH.has(n),past:!!n&&PAST.has(n),people:[]}}
function resetNet(){COS.length=0;P.length=0;for(const k in CO)delete CO[k];for(const k in PI)delete PI[k]}
// "Acme Robotics" and "Acme Robotics, LLC" are one company.
function addCo(name){const k=normCo(name)||'(none)';if(CO[k])return CO[k];const c=companyOf(name);CO[k]=c;COS.push(c);return c}
function personOf(o,co){return{id:o.id,first:o.first||'',last:o.last||'',name:((o.first||'')+' '+(o.last||'')).trim(),title:o.title||'',co,url:o.url||'',connected:o.connected||'',dir:o.dir||'none',count:o.count||0,fm:o.fm||null,lm:o.lm||null,level:LV(o.title||'')}}
function addPerson(o){const co=addCo(o.company);const p=personOf(o,co);P.push(p);PI[p.id]=p;co.people.push(p);return p}
function buildFromNet(net){resetNet();net.people.forEach(o=>addPerson(o))}

/* ---------- Groups. A person lives in the first group that matches, in the user's order; other matches are tags. ---------- */
/* Warm: a two-way thread whose last message falls inside the warm window, counted back from the export's date. */
let WARM_WINDOW='any';
function inWindow(d){if(WARM_WINDOW==='any')return true;if(!d)return false;
  const ref=EXPORTED||today(),yrs=WARM_WINDOW==='1y'?1:3;return d>=(+ref.slice(0,4)-yrs)+ref.slice(4)}
const DEFAULTS={
  warm:{label:'Warm',rule:"Anyone you've exchanged messages with.",test:p=>p.dir==='both'&&inWindow(p.lm)?'exchanged messages'+(p.lm?', the last in '+fmtM(p.lm):''):null},
  recruiters:{label:'Recruiters',rule:'Recruiters, sourcers, headhunters and talent acquisition, plus anyone at a search firm.',test:p=>{const m=p.title.match(/recruit\w*|talent acquisition|sourcer|headhunt\w*|search/i);return m?'title has "'+m[0].toLowerCase()+'"':p.co.search?'works at a search firm':null}},
  hr:{label:'HR / People',rule:'HR and People titles. Recruiters have their own group.',test:p=>{if(/recruit|talent acq/i.test(p.title))return null;const m=p.title.match(/\bHRBP\b|\bCHRO\b|\bHR\b|human resources|people|total rewards/i);return m?'title has "'+m[0]+'"':null}},
  exec:{label:'Executives',rule:'C-suite and VPs, plus general managers and managing directors.',test:p=>{const m=p.title.match(/\b(CEO|COO|CFO|CTO|Chief|VP|SVP|EVP|President|General Manager|Managing Director)\b/);return m?'title has "'+m[0]+'"':null}},
  founders:{label:'Entrepreneurs',rule:'Founders, owners and the self-employed.',test:p=>{const m=p.title.match(/founder|owner|self-employed/i);return m?'title has "'+m[0].toLowerCase()+'"':null}}
};
/* A custom group's rule, as references/data-format.md describes it. Each returns the reason it matched, or null. */
const wordRe=w=>new RegExp('(^|[^a-z0-9])'+w.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z0-9])','i');
function matcher(m){
  if(Array.isArray(m.companies)){const set=new Set(m.companies.map(normCo).filter(Boolean));return p=>set.has(p.co.norm)?'works at '+p.co.name:null}
  if(Array.isArray(m.titleWords)){const rs=m.titleWords.map(w=>String(w).trim()).filter(Boolean).map(w=>[w,wordRe(w)]);return p=>{const hit=rs.find(x=>x[1].test(p.title));return hit?'title has "'+hit[0].toLowerCase()+'"':null}}
  if(m.connected&&typeof m.connected==='object'){const f=m.connected.from||'',t=m.connected.to||'9999-12-31';return p=>p.connected&&p.connected>=f&&p.connected<=t?'connected '+fmtM(p.connected)+', inside your dates':null}
  if(Array.isArray(m.names)){const set=new Set(m.names.map(normName).filter(Boolean));return p=>set.has(normName(p.name))?'on your hand-picked list':null}
  if(m.jobSearch===true)return p=>p.co.inSearch?'works at '+p.co.name+', in your job search':null;
  return ()=>null}
const GROUP_COLORS={warm:'#2f9e64',recruiters:'#7c5cd6',hr:'#1f8f8c',exec:'#3b6fd8',founders:'#c9831b'};
const CUSTOM_COLORS=['#c4487a','#1f8fb8','#8a9a2b','#b05cc6','#d0603f','#4f8f6f','#a8732a','#6a72c8'];
let GROUPS=[],GL={},TABKEYS=[];
function readConfig(){
  WARM_WINDOW=['any','3y','1y'].includes(CONFIG.warmWindow)?CONFIG.warmWindow:'any';
  PAST=new Set((Array.isArray(CONFIG.pastEmployers)?CONFIG.pastEmployers:[]).map(normCo).filter(Boolean));
  SEARCH=new Set((Array.isArray(CONFIG.searchCompanies)?CONFIG.searchCompanies:[]).map(normCo).filter(Boolean));
  // No group list at all (the template opened as is): the five defaults, in their usual order.
  const list=Array.isArray(CONFIG.groups)?CONFIG.groups:Object.keys(DEFAULTS).map(k=>({key:k,default:k}));
  const seen=new Set();let ci=0;GROUPS=[];
  list.forEach(g=>{if(!g||typeof g!=='object')return;const d=g.default&&DEFAULTS[g.default];

document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#uplDrop');if(d&&!d.contains(e.relatedTarget))d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#uplDrop');if(d&&!dragId){e.preventDefault();takeFiles(e.dataTransfer.files)}});

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){
    if(e.target.id==='scrim'){closePanel();return}
    const card=e.target.closest('main .card');if(card&&!e.target.closest('button')){openerId=card.dataset.id;openPerson(card.dataset.id)}
    if(!e.target.closest('details'))document.querySelectorAll('details.about[open],details.menu[open]').forEach(d=>d.open=false);
    return}
  const a=el.dataset.act;const row=el.closest('[data-id]');const id=row&&row.dataset.id;const p=id&&PI[id];
  const inMain=row&&row.classList.contains('row')&&row.closest('main');
  const rowIdx=inMain?[...document.querySelectorAll('main .row')].indexOf(row):null;
  const kb=e.detail===0;
  switch(a){
    case 'open':openerId=id;openPerson(id);break;
    case 'help':go(R0.tab,'h','board',!!R0.kind);break;
    case 'tipok':TIPS[el.dataset.tip]=1;try{localStorage.setItem(TIPS_KEY,JSON.stringify(TIPS))}catch(err){}render();break;
    case 'tipsreset':TIPS={};try{localStorage.removeItem(TIPS_KEY)}catch(err){}closePanel();toast('Tips are back');break;
    // A mouse click leaves focus alone; only a keyboard press (detail 0) carries focus to the next row.
    case 'up':leave(inMain?row:null,()=>{setStage([id],'Up Next',p.name+' added to In Motion');if(rowIdx!=null&&kb)focusAfter=rowIdx;render()});break;
    case 'skip':leave(inMain?row:null,()=>{setStage([id],'Archived',p.name+' archived');if(rowIdx!=null&&kb)focusAfter=rowIdx;render()});break;
    case 'restore':setStage([id],'Not Started',p.name+' restored');render();break;
    case 'reopen':setStage([id],'Active',p.name+' reopened');render();break;
    case 'star':case 'pstar':{const pid=id||R0.id;const s=mut(pid);s.star=!s.star;save();render();toast((s.star?'Starred ':'Unstarred ')+PI[pid].name);break}
    case 'sel':{const ids=listIds;if(e.shiftKey&&lastChecked!=null){const i1=ids.indexOf(lastChecked),i2=ids.indexOf(id);const[lo,hi]=i1<i2?[i1,i2]:[i2,i1];for(let i=lo;i<=hi;i++)if(i<LIMIT)sel.add(ids[i])}else{el.checked?sel.add(id):sel.delete(id)}lastChecked=id;render();break}
    case 'selall':{const shown=listIds.slice(0,LIMIT);if(shown.every(x=>sel.has(x)))shown.forEach(x=>sel.delete(x));else shown.forEach(x=>sel.add(x));render();break}
    case 'more':LIMIT+=150;render();break;
    case 'mv':{const to=el.dataset.to;setStage([id],to,p.name+' moved to '+to);if(to==='Concluded'){openerId=id;openPerson(id)}else render();break}
    case 'log':openerId=id;openPerson(id);setTimeout(()=>$('lgText')?.focus(),30);break;
    case 'focuslog':$('lgText')?.focus();$('lgText')?.scrollIntoView({block:'center'});break;
    case 'costar':{const sl=el.dataset.co||el.closest('[data-co]').dataset.co;S.co[sl]=!S.co[sl];if(!S.co[sl])delete S.co[sl];save();render();break}
    case 'view':VIEW=el.dataset.to;try{localStorage.setItem(VIEW_KEY,VIEW)}catch(err){}LIMIT=150;sel.clear();render();break;
    case 'coexpand':{const sl=el.dataset.co;EXPANDED.has(sl)?EXPANDED.delete(sl):EXPANDED.add(sl);render();break}
    case 'coskipgrp':{const ids=el.dataset.ids.split(',');const c=PI[ids[0]].co;setStage(ids,'Archived','Archived '+ids.length+' at '+c.name);render();break}
    case 'opencompany':{const sl=el.dataset.co||el.closest('[data-co]').dataset.co;openerId=sl;go(R0.tab,'c',sl,!!R0.kind);break}
    case 'close':closePanel();break;
    case 'prev':step(-1);break;case 'next':step(1);break;
    case 'stage':{const pid=R0.id;const to=el.dataset.to;setStage([pid],to,PI[pid].name+(to==='Up Next'?' added to In Motion':to==='Archived'?' archived':' moved to '+to));render();break}
    case 'outcome':{const s=mut(R0.id);const snap=snapshot([R0.id]);s.outcome=s.outcome===el.dataset.to?undefined:el.dataset.to;pushUndo(snap,'outcome');save();render();break}
    case 'ltype':LOGTYPE=el.dataset.to;{const v=$('lgText').value;render();$('lgText').value=v;$('lgText').focus()}break;
    case 'ldate':LOGDATE=today();{const v=$('lgText').value;render();$('lgText').value=v;$('lgDate')?.focus()}break;
    case 'logadd':{const txt=$('lgText').value.trim();if(!txt){$('lgText').focus();return}const s=mut(R0.id);(s.log=s.log||[]).unshift({id:uid(),date:($('lgDate')&&$('lgDate').value)||today(),type:LOGTYPE,text:txt});LOGDATE=null;save();render();$('lgText')?.focus();toast('Logged');break}
    case 'logedit':editLog=el.dataset.lg;render();$('leText')?.focus();break;
    case 'logcancel':editLog=null;render();break;
    case 'logsave':{const s=mut(R0.id);const en=s.log.find(x=>x.id===el.dataset.lg);if(en){en.date=$('leDate').value||en.date;en.type=$('leType').value;en.text=$('leText').value.trim()||en.text}editLog=null;save();render();break}
    case 'logdel':{const snap=snapshot([R0.id]);const s=mut(R0.id);s.log=s.log.filter(x=>x.id!==el.dataset.lg);pushUndo(snap,'log entry deleted');save();render();toast('Log entry deleted',true);break}
    case 'upload':if(!HAS_NET){const b=document.querySelector('#welcome [data-act=uplpick]');if(b){b.scrollIntoView({block:'center'});b.focus()}break}go(R0.tab,'u','export',!!R0.kind);break;
    case 'uplpick':$('uplFile')?.click();break;
    case 'uplcancel':PENDING=null;UPLERR='';render();break;
    case 'uplok':useExport();break;
    case 'uplremove':if(confirm('Remove your export and its board from this browser? Your stages, notes and log go too.'))removeExport();break;
    case 'bulkup':{const ids=[...sel];setStage(ids,'Up Next',ids.length+' added to In Motion');sel.clear();render();break}
    case 'bulkskip':{const ids=[...sel];setStage(ids,'Archived',ids.length+' archived');sel.clear();render();break}
    case 'bulkclear':sel.clear();render();break;
    case 'ftoggle':FOPEN=!FOPEN;render();break;
    case 'seltoggle':SELMODE=!SELMODE;if(!SELMODE)sel.clear();render();break;
    case 'mshow':MSHOW=el.dataset.to;render();break;
    case 'undo':undo();break;
  }
});
$('main').addEventListener('click',e=>{const f=e.target.closest('.chipf[data-f]');if(f){F[f.dataset.f]=!F[f.dataset.f];LIMIT=150;render()}});
document.addEventListener('change',e=>{if(e.target.id==='gsel'&&e.target.value)go(e.target.value)});
function openPerson(id){const p=PI[id];if(!p)return;const tab=R0.tab==='motion'||R0.tab===p.home?R0.tab:p.home;editLog=null;LOGDATE=null;go(tab,'p',id,!!R0.kind)}
function closePanel(){editLog=null;if(history.state&&history.state.panel)history.back();else go(R0.tab,null,null,true)}
let panelIdx=0;
function step(d){if(R0.kind!=='p')return;let i=listIds.indexOf(R0.id);if(i<0)i=d>0?panelIdx-1:panelIdx;const n=listIds[i+d];if(n){editLog=null;openerId=n;go(R0.tab,'p',n,true)}}
let notesT;
document.addEventListener('input',e=>{if(e.target.id==='notes'){const id=e.target.dataset.id;clearTimeout(notesT);const v=e.target.value;notesT=setTimeout(()=>{mut(id).notes=v;if(save()){const t=$('notesSaved');if(t){t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1500)}}},400)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lgText'){e.preventDefault();document.querySelector('[data-act=logadd]')?.click()}});

/* Drag between In Motion columns */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card');if(!c)return;dragId=c.dataset.id;c.classList.add('drag');e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragend',e=>{const c=e.target.closest&&e.target.closest('.card');if(c)c.classList.remove('drag');document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'))});
document.addEventListener('dragover',e=>{const c=e.target.closest('.col');if(!c||!dragId)return;e.preventDefault();c.classList.add('over')});
document.addEventListener('dragleave',e=>{const c=e.target.closest('.col');if(c&&!c.contains(e.relatedTarget))c.classList.remove('over')});
document.addEventListener('drop',e=>{const c=e.target.closest('.col');if(!c||!dragId)return;e.preventDefault();const to=c.dataset.stage;if(get(dragId).stage!==to)setStage([dragId],to,PI[dragId].name+' moved to '+to);dragId=null;render()});

/* Keys: / opens search and Esc closes. Everything else has a button. */
document.addEventListener('keydown',e=>{
  const t=e.target;const typing=(t.tagName==='INPUT'&&t.type!=='checkbox')||t.tagName==='TEXTAREA'||t.tagName==='SELECT';
  if(e.key==='Escape'){if(!$('sug').hidden){hideSug();$('q').blur();return}if(R0.kind){closePanel();return}if(sel.size){sel.clear();render();return}return}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='/'){e.preventDefault();$('q').focus()}
});
document.addEventListener('focusin',e=>{document.querySelectorAll('main .row.focus').forEach(r=>r.classList.remove('focus'));const r=e.target.closest&&e.target.closest('main .row');if(r&&e.target.matches(':focus-visible'))r.classList.add('focus')});

/* Search across everyone */
const q=$('q'),sug=$('sug');let sIdx=0,sRes=[];
function hideSug(){sug.hidden=true;q.setAttribute('aria-expanded','false')}
const hl=(text,v)=>{const s=esc(text);const i=text.toLowerCase().indexOf(v);if(i<0)return s;return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+v.length))+'</mark>'+esc(text.slice(i+v.length))};
q.addEventListener('input',()=>{const v=q.value.trim().toLowerCase();if(v.length<2){hideSug();return}
  const ps=P.filter(p=>(p.name+' '+p.title+' '+p.co.name+' '+(get(p.id).notes||'')).toLowerCase().includes(v)).sort((a,b)=>(b.name.toLowerCase().startsWith(v))-(a.name.toLowerCase().startsWith(v))||cmp(a,b)).slice(0,8);
  const cs=COS.filter(c=>c.people.length&&c.name.toLowerCase().includes(v)).slice(0,4);
  sRes=[...cs.map(c=>({k:'c',id:c.slug,n:c.name,s:c.people.length+' you know'+(c.inSearch?' · in your search':''),t:'Company'})),...ps.map(p=>{const st=get(p.id).stage;return{k:'p',id:p.id,n:p.name,s:p.title+' · '+p.co.name,t:LIVE.includes(st)?'In Motion':GL[p.home]}})];
  sIdx=0;let i=-1;const item=r=>{i++;return '<button role="option" data-i="'+i+'" class="'+(i===0?'on':'')+'" aria-selected="'+(i===0)+'"><span class="n">'+hl(r.n,v)+'</span><span class="k">'+esc(r.t)+'</span><span class="s">'+hl(r.s,v)+'</span></button>'};
  const cRes=sRes.filter(r=>r.k==='c'),pRes=sRes.filter(r=>r.k==='p');
  sug.innerHTML=sRes.length?(cRes.length?'<div class="sh">Companies</div>'+cRes.map(item).join(''):'')+(pRes.length?'<div class="sh">People</div>'+pRes.map(item).join(''):''):'<div class="none">No one matches "'+esc(q.value)+'"</div>';
  sug.hidden=false;q.setAttribute('aria-expanded','true')});
q.addEventListener('keydown',e=>{if(sug.hidden||!sRes.length)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sIdx=(sIdx+(e.key==='ArrowDown'?1:-1)+sRes.length)%sRes.length;sug.querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('on',i===sIdx);b.setAttribute('aria-selected',i===sIdx)})}
  else if(e.key==='Enter'){e.preventDefault();pickSug(sIdx)}});
sug.addEventListener('mousedown',e=>{const b=e.target.closest('button[data-i]');if(b){e.preventDefault();pickSug(+b.dataset.i)}});
q.addEventListener('blur',()=>setTimeout(hideSug,120));
function pickSug(i){const r=sRes[i];if(!r)return;hideSug();q.value='';q.blur();
  if(r.k==='c'){openerId=r.id;go(R0.tab,'c',r.id)}else{const p=PI[r.id];openerId=r.id;go(LIVE.includes(get(p.id).stage)?'motion':p.home,'p',r.id)}}

/* On a phone the header tucks away while scrolling down and returns on the way up. */
let lastY=0;
window.addEventListener('scroll',()=>{const y=scrollY;$('top').classList.toggle('tuck',phone()&&y>lastY&&y>120);lastY=y},{passive:true});

/* The accent is the user's color from Bishop setup (the profile's Customization section), carried in
   the config. Bishop orange stays on the mark and on navy. Light and dark versions are derived here and
   darkened or lightened until text passes 4.5:1, on the surface and on its own tint. */
const ACCENT_FALLBACK='#4F6D9F';
const ACCENT=/^#[0-9a-f]{6}$/i.test(String(CONFIG.accent||'').trim())?String(CONFIG.accent).trim():ACCENT_FALLBACK;
const rgbOf=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
const hexOf=c=>'#'+c.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,k)=>a.map((v,i)=>v*k+b[i]*(1-k));
const lum=c=>{const[r,g,b]=c.map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4});return .2126*r+.7152*g+.0722*b};
const contrast=(a,b)=>{const[x,y]=[lum(a),lum(b)].sort((p,q)=>q-p);return(x+.05)/(y+.05)};
const toHsl=([r,g,b])=>{r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6}return[h,s,l]};
const fromHsl=([h,s,l])=>{if(!s)return[l,l,l].map(v=>v*255);const q=l<.5?l*(1+s):l+s-l*s,p=2*l-q;
  const f=t=>{t=(t+1)%1;return t<1/6?p+(q-p)*6*t:t<1/2?q:t<2/3?p+(q-p)*(2/3-t)*6:p};return[f(h+1/3),f(h),f(h-1/3)].map(v=>v*255)};
/* Lightness moves in steps toward the ground's opposite; hue and saturation stay, so the color keeps its character. */
/* A muted color sitting next to the navy layer reads as grey, so a colored accent gets at least
   55% saturation. A near-neutral pick (Graphite) stays neutral; grey is the point of it. */
function tune(base,ground,toward,weakK){const up=lum(toward)>lum(ground);let hsl=toHsl(base);
  if(hsl[1]>=.15&&hsl[1]<.55){hsl=[hsl[0],.55,hsl[2]]}
  let c=fromHsl(hsl),weak=mix(c,ground,weakK);
  for(let i=0;i<40&&(contrast(c,ground)<4.5||contrast(c,weak)<4.5);i++){hsl=[hsl[0],hsl[1],Math.max(0,Math.min(1,hsl[2]+(up?.025:-.025)))];c=fromHsl(hsl);weak=mix(c,ground,weakK)}
  const ink=contrast([255,255,255],c)>=contrast([14,20,34],c)?'#ffffff':'#0e1422';
  return{accent:hexOf(c),weak:hexOf(weak),ink}}
/* Group and stage colors carry meaning, so they stay put unless the accent lands on the same hue.
   Then that group (or the Active column) takes the first spare color that clears the accent and every other group. */
const ACTIVE_COLOR='#2f9e64';
const SPARES=['#c4487a','#8a9a2b','#1f8fb8','#b05cc6','#d0603f','#e0559a','#5aa02c','#2fa3c4','#9b59d0','#e07a3a','#3aa88f','#c74b4b','#5d6fd6','#b8962a'];
const hueGap=(a,b)=>{const d=Math.abs(a-b)%1;return Math.min(d,1-d)*360};
/* Custom groups take spare colors too, so with many groups no spare may clear every other group by 20
   degrees. Then the one farthest from its nearest neighbor wins: it still clears the accent. */
function groupColors(base){const ah=toHsl(base),hue=x=>toHsl(rgbOf(x))[0],eff={},CONCLUDED='#7a3fb0';
  GROUPS.forEach(g=>eff[g.key]=g.color);eff.active=ACTIVE_COLOR;
  if(ah[1]>=.15)for(const k of Object.keys(eff)){
    if(hueGap(hue(eff[k]),ah[0])>=30)continue;
    const others=[...Object.entries(eff).filter(([j])=>j!==k).map(([,v])=>v),CONCLUDED];
    const near=x=>Math.min(...others.map(g=>hueGap(hue(x),hue(g))));
    const free=SPARES.filter(x=>!Object.values(eff).includes(x)&&hueGap(hue(x),ah[0])>=30);
    const spare=free.find(x=>near(x)>=20)||free.sort((a,b)=>near(b)-near(a))[0];
    if(spare)eff[k]=spare}
  return eff}
function applyAccent(hex){
  const base=rgbOf(hex),L=tune(base,[255,255,255],[0,0,0],.12),D=tune(base,[21,29,46],[255,255,255],.2);
  const gc=Object.entries(groupColors(base)).map(([k,v])=>';--g-'+k+':'+v).join('');
  let st=document.getElementById('accentVars');if(!st){st=document.createElement('style');st.id='accentVars';document.head.appendChild(st)}
  st.textContent=':root{--accent:'+L.accent+';--accent-weak:'+L.weak+';--accent-ink:'+L.ink+gc+'}:root[data-theme=dark]{--accent:'+D.accent+';--accent-weak:'+D.weak+';--accent-ink:'+D.ink+'}'+
    GROUPS.map(g=>'.g-'+g.key+'{--gc:var(--g-'+g.key+')}').join('');
}
applyAccent(ACCENT);
/* The name the user gave their Bishop, in the top bar the way the decks and the dashboard show it. */
$('brandName').textContent=BOT_NAME;$('brand').setAttribute('aria-label','Outreach, '+BOT_NAME);document.title='Outreach · '+BOT_NAME;

/* Theme */
function themeLabel(){const dark=document.documentElement.dataset.theme==='dark';const b=$('themeBtn');b.setAttribute('aria-label','Switch to '+(dark?'light':'dark')+' theme');b.title=dark?'Light Theme':'Dark Theme'}
$('themeBtn').addEventListener('click',()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem(THEME_KEY,d.dataset.theme)}catch(e){}themeLabel()});
themeLabel();

render();if(HAS_NET)save();
</script>
